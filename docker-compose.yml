# Delivery 1a: HTTP time service. No docker socket is mounted; container and
# inline targets (which need it) arrive in 1b.
services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: pipeline-runner:latest
    container_name: pipeline-runner  # bridge-mcp's restart allowlist pins this name
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"  # host nginx only; never 0.0.0.0
    env_file:
      - .env
    environment:
      - PORT=3000
      - METRICS_PORT=9464
      - DATA_DIR=${HOST_DATA_DIR:-/root/pipeline-runner-data}
    volumes:
      - ${HOST_DATA_DIR:-/root/pipeline-runner-data}:${HOST_DATA_DIR:-/root/pipeline-runner-data}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    networks:
      default:
        gw_priority: 100  # published-port traffic arrives from this gateway (TRUSTED_PROXIES)
      shared: {}
      secrets-manager_default: {}
      monitoring_monitoring: {}
    labels:
      autoheal: "true"
    healthcheck:
      # The engine loop must keep iterating; /healthz 503s within 60 s of a stall.
      test: ["CMD", "plr", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s  # 20 s drain for in-flight callbacks, then exit
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24  # gateway 172.31.250.1 → TRUSTED_PROXIES
  shared:
    external: true
  secrets-manager_default:
    external: true
  monitoring_monitoring:
    external: true
