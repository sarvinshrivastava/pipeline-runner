name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: Test (race detector)
        run: go test -race ./...
      - name: Fire-delay precision (acceptance 1, without the race detector)
        run: go test -run TestFireDelayP99 -count=1 ./internal/engine/
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Image builds
        run: docker build -q -t plr-ci .
