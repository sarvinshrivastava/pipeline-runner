name: deploy

# Manual only, matching every other service on the box: a stray push must never
# trigger a live deploy.
on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Roll back to a previously deployed image (short git SHA). Leave empty to deploy main."
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          if [ -n "$ROLLBACK_SHA" ] && ! echo "$ROLLBACK_SHA" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "rollback_sha must be a hex git SHA" >&2
            exit 1
          fi

      - name: Fetch VPS credentials from the secrets manager
        id: creds
        run: |
          set -euo pipefail
          EXPORTS=$(curl -sf -H "X-API-Key: ${{ secrets.SM_READ_TOKEN }}" \
            "${{ secrets.SM_URL }}/api/exports")
          echo "::add-mask::$(echo "$EXPORTS" | grep '^VPS_SSH_KEY=' | cut -d= -f2-)"
          {
            echo "host<<EOF"
            echo "$EXPORTS" | grep '^VPS_HOST=' | cut -d= -f2-
            echo "EOF"
            echo "key<<EOF"
            echo "$EXPORTS" | grep '^VPS_SSH_KEY=' | cut -d= -f2-
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        with:
          host: ${{ steps.creds.outputs.host }}
          username: root
          key: ${{ steps.creds.outputs.key }}
          envs: ROLLBACK_SHA
          script: |
            set -euo pipefail
            REPO_NAME=$(basename "${{ github.repository }}")
            APP_DIR="/root/apps/$REPO_NAME"

            if [ -n "${ROLLBACK_SHA:-}" ]; then
              # Rollback: no pull, no rebuild. A binary older than the database
              # schema refuses to start; roll forward in that case.
              docker image inspect "pipeline-runner:$ROLLBACK_SHA" >/dev/null
              docker tag "pipeline-runner:$ROLLBACK_SHA" pipeline-runner:latest
              docker compose -f "$APP_DIR/docker-compose.yml" up -d --no-build
              echo "Rolled back to $ROLLBACK_SHA"
              exit 0
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "${{ github.server_url }}/${{ github.repository }}.git" "$APP_DIR"
            else
              git -C "$APP_DIR" pull origin main
            fi
            # Stamps the binary's version (compose passes it as a build arg).
            export GIT_SHA=$(git -C "$APP_DIR" rev-parse --short HEAD)
            vps-deploy "$REPO_NAME" "$APP_DIR"
            docker tag pipeline-runner:latest "pipeline-runner:$GIT_SHA"
            # Keep the five newest SHA tags for rollback.
            docker images pipeline-runner --format '{{.CreatedAt}}|{{.Tag}}' \
              | grep -v '|latest$' | sort -r | awk -F'|' 'NR>5 {print $2}' \
              | xargs -r -I{} docker rmi "pipeline-runner:{}" || true
